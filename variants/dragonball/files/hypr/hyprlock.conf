# Theme Studio / 龙珠 · 金色气焰
general {
    hide_cursor = true
}
background {
    monitor =
    path = @PACKAGE@/variants/dragonball/wallpaper.png
    color = rgb(101e23)
    blur_passes = 0
    brightness = 0.65
}
label {
    monitor =
    text = KAME  /  SESSION LOCKED
    color = rgb(e6bb65)
    font_family = Alibaba PuHuiTi 3.0
    font_size = 12
    position = 64, 294
    halign = left
    valign = bottom
}
label {
    monitor =
    text = $TIME
    color = rgb(e0e5d5)
    font_family = monospace
    font_size = 54
    position = 60, 200
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:60000] date +"%Y.%m.%d  /  %A"
    color = rgb(77999c)
    font_family = Alibaba PuHuiTi 3.0
    font_size = 12
    position = 64, 164
    halign = left
    valign = bottom
}
input-field {
    monitor =
    size = 320, 40
    position = 64, 96
    halign = left
    valign = bottom
    outline_thickness = 1
    rounding = 0
    inner_color = rgba(101e23ee)
    outer_color = rgb(38545b)
    check_color = rgb(e6bb65)
    fail_color = rgb(d47f78)
    font_color = rgb(e0e5d5)
    font_family = Alibaba PuHuiTi 3.0
    placeholder_text = Password · Enter to unlock
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
}
