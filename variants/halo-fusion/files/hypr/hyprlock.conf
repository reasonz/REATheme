# Theme Studio / 光环 × 环太平洋 · 融合机甲
general {
    hide_cursor = true
}
background {
    monitor =
    path = @PACKAGE@/variants/halo-fusion/wallpaper.png
    color = rgb(151b18)
    blur_passes = 0
    brightness = 0.65
}
label {
    monitor =
    text = AEGIS  /  SESSION LOCKED
    color = rgb(c7ae6b)
    font_family = Alibaba PuHuiTi 3.0
    font_size = 12
    position = 64, 294
    halign = left
    valign = bottom
}
label {
    monitor =
    text = $TIME
    color = rgb(d7ddc6)
    font_family = monospace
    font_size = 54
    position = 60, 200
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:60000] date +"%Y.%m.%d  /  %A"
    color = rgb(83917c)
    font_family = Alibaba PuHuiTi 3.0
    font_size = 12
    position = 64, 164
    halign = left
    valign = bottom
}
input-field {
    monitor =
    size = 320, 40
    position = 64, 96
    halign = left
    valign = bottom
    outline_thickness = 1
    rounding = 0
    inner_color = rgba(151b18ee)
    outer_color = rgb(4a5840)
    check_color = rgb(c7ae6b)
    fail_color = rgb(d47f78)
    font_color = rgb(d7ddc6)
    font_family = Alibaba PuHuiTi 3.0
    placeholder_text = Password · Enter to unlock
    fail_text = $PAMFAIL
    fade_on_empty = false
    dots_size = 0.22
    dots_spacing = 0.35
}
